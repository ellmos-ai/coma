[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coma"
version = "0.3.2"
description = "COMA - Lebenszyklus-Schicht für Agenten: Prozess starten, in Kontakt bleiben, Ergebnis abholen"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
authors = [
    {name = "Lukas Geiger"},
]
keywords = [
    "ai", "agent", "orchestration", "subprocess", "lifecycle", "cli-adapter",
    "claude-code", "multi-agent", "autonomous-agents", "local-first",
    "session-decoupling", "job-board", "ellmos", "zero-egress", "open-bricks",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Distributed Computing",
]
# Absichtlich leer. COMA arbeitet mit Dateien und Prozessen -- ohne Konto, ohne
# Netz, ohne Cluster. Das ist sein Trennungsgrund gegenüber Roshambo, nicht ein
# noch nicht erledigter Schritt. Siehe KONZEPT.md, Abschnitt "Offline".
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/coma"
Repository = "https://github.com/ellmos-ai/coma"
Documentation = "https://github.com/ellmos-ai/coma#readme"
Issues = "https://github.com/ellmos-ai/coma/issues"
Changelog = "https://github.com/ellmos-ai/coma/blob/main/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/coma/blob/main/SECURITY.md"
Notice = "https://github.com/ellmos-ai/coma/blob/main/NOTICE"
"LLM Ready" = "https://github.com/ellmos-ai/coma/blob/main/llms.txt"
"Marketing Log" = "https://github.com/ellmos-ai/coma/blob/main/MARKETING-LOG.txt"
"Third-Party Licenses" = "https://github.com/ellmos-ai/coma/blob/main/THIRD_PARTY_LICENSES.md"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[project.scripts]
coma = "coma.cli:main"
comas = "coma.cli:main"

[tool.setuptools.packages.find]
include = ["coma*", "comas*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-ra -v"
norecursedirs = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "build",
    "dist",
    ".venv",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
