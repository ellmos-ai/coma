[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coma"
version = "0.3.0"
description = "COMA - Lebenszyklus-Schicht für Agenten: Prozess starten, in Kontakt bleiben, Ergebnis abholen"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Lukas Geiger"},
]
keywords = [
    "ai", "agent", "orchestration", "subprocess", "lifecycle", "cli-adapter",
    "claude-code", "multi-agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Distributed Computing",
]
# Absichtlich leer. COMA arbeitet mit Dateien und Prozessen -- ohne Konto, ohne
# Netz, ohne Cluster. Das ist sein Trennungsgrund gegenüber Roshambo, nicht ein
# noch nicht erledigter Schritt. Siehe KONZEPT.md, Abschnitt "Offline".
dependencies = []

[project.scripts]
coma = "coma.cli:main"
comas = "coma.cli:main"

[tool.setuptools.packages.find]
include = ["coma*", "comas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
